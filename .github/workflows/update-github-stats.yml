name: Update GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get GitHub contribution total
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROFILE_TOKEN }}
          script: |
            const fs = require("fs");

            const query = `
              query {
                viewer {
                  contributionsCollection {
                    contributionCalendar {
                      totalContributions
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query);
            const total = result.viewer.contributionsCollection.contributionCalendar.totalContributions;

            fs.writeFileSync(
              "github-stats.json",
              JSON.stringify(
                {
                  totalContributions: total,
                  updatedAt: new Date().toISOString()
                },
                null,
                2
              )
            );

      - name: Commit updated stats
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add github-stats.json
          git commit -m "Update GitHub stats" || exit 0
          git push
